<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutam Coin</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

</head>
<body>
<style>
  body{
margin:0;
font-family:Arial;
background:#f5f5f5;
}

header{
display:flex;
justify-content:space-between;
padding:15px;
background:white;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.container{
padding:15px;
}

.card{
background:white;
padding:15px;
margin:15px 0;
border-radius:10px;
}

button{
background:#16a34a;
color:white;
padding:10px;
border:none;
border-radius:6px;
}

input{
width:100%;
padding:10px;
margin:5px 0;
}

.modal{
display:none;
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
}

.modal-content{
background:white;
margin:100px auto;
padding:20px;
width:300px;
border-radius:10px;
}
  .ref-box{
display:flex;
gap:10px;
margin:10px 0;
}

.ref-box input{
flex:1;
}
</style>
<header>
<div class="logo">💰 Tutam Coin</div>
<div class="wallet">Balance: <span id="balance">0</span></div>
<button onclick="openModal()">Get Started</button>
</header>

<div class="container">

  <div class="card">

<h2>👥 Referral Program</h2>

<p>Invite friends & earn <b>500 coins</b> per signup</p>

<h3>Your Code:</h3>
<div class="ref-box">
<span id="refCode">---</span>
<button onclick="copyRef()">Copy</button>
</div>

<h3>Your Link:</h3>
<div class="ref-box">
<input id="refLink" readonly>
<button onclick="copyLink()">Copy</button>
</div>

<hr>

<h3>Enter Referral Code</h3>
<input id="refInput" placeholder="Enter code">
<button onclick="applyReferral()">Apply Code</button>

<hr>

<h3>My Referrals</h3>
<p>Total Invites: <span id="totalRefs">0</span></p>
<p>Total Earned: <span id="refEarn">0</span> coins</p>

  </div>
<div class="card">
<h3>BTC/USDT Live Price</h3>
<h2 id="btcPrice">Loading...</h2>
</div>

<div class="card">
<h3>Earn Coins</h3>

<video id="video" controls width="100%">
<source src="https://www.w3schools.com/html/mov_bbb.mp4">
</video>

<p>Earned: <span id="earned">0</span></p>

</div>

<div class="card">
<h3>Referral</h3>
<p>Your Code: <span id="refCode"></span></p>
<input id="refInput" placeholder="Enter referral code">
<button onclick="applyReferral()">Apply</button>
</div>

</div>

<!-- AUTH MODAL -->
<div class="modal" id="modal">
<div class="modal-content">

<h2 id="authTitle">Sign In</h2>

<input id="name" placeholder="Name" style="display:none;">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="auth()" id="authBtn">Sign In</button>

<p onclick="toggleAuth()" id="toggle">Create account</p>

</div>
</div>

<script src="firebase.js"></script>
<script src="api.js"></script>
<script src="referral.js"></script>
<script src="app.js"></script>

</body>
</html>
