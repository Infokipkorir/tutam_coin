<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutam Coin</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

</head>

<body>

<header>
<div class="logo">💰 Tutam Coin</div>
<div class="wallet">Balance: <span id="balance">0</span></div>
<button onclick="openModal()">Get Started</button>
</header>

<div class="container">

<div class="card">
<h3>BTC/USDT Live Price</h3>
<h2 id="btcPrice">Loading...</h2>
</div>

<div class="card">
<h3>Earn Coins</h3>

<video id="video" controls width="100%">
<source src="https://www.w3schools.com/html/mov_bbb.mp4">
</video>

<p>Earned: <span id="earned">0</span></p>

</div>

<div class="card">
<h3>Referral</h3>
<p>Your Code: <span id="refCode"></span></p>
<input id="refInput" placeholder="Enter referral code">
<button onclick="applyReferral()">Apply</button>
</div>

</div>

<!-- AUTH MODAL -->
<div class="modal" id="modal">
<div class="modal-content">

<h2 id="authTitle">Sign In</h2>

<input id="name" placeholder="Name" style="display:none;">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="auth()" id="authBtn">Sign In</button>

<p onclick="toggleAuth()" id="toggle">Create account</p>

</div>
</div>

<script src="firebase.js"></script>
<script src="api.js"></script>
<script src="referral.js"></script>
<script src="app.js"></script>

</body>
</html>
