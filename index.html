<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tutam Coin</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
margin:0;
background:white;
color:black;
text-align:center;
}

header{
background:#f4f4f4;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:22px;
display:flex;
gap:8px;
}

.wallet{
background:#eee;
padding:8px 14px;
border-radius:8px;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.section{
background:#fafafa;
padding:20px;
margin:20px 0;
border-radius:10px;
border:1px solid #ddd;
}

button{
padding:10px 18px;
background:green;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#0a8f1c;
}

input{
padding:8px;
margin:5px;
border-radius:4px;
border:1px solid #ccc;
}

.task{
background:#f6f6f6;
padding:15px;
margin:10px 0;
border-radius:8px;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
}

.modal-content{
background:white;
padding:20px;
width:320px;
margin:100px auto;
border-radius:10px;
}

.close{
float:right;
cursor:pointer;
font-size:20px;
}

canvas{
background:white;
}

</style>

</head>

<body>

<header>

<div class="logo">
✌️ Tutam Coin
</div>

<div class="wallet">
Balance: <span id="balance">0</span>
</div>

<div>
<button onclick="openModal('loginModal')">Sign In</button>
<button onclick="openModal('signupModal')">Sign Up</button>
</div>

</header>

<div class="container">

<div class="section">

<h2>Tutam Coin Value</h2>

<p>1000 Coins = $0.50</p>

<p>Current Price: $<span id="coinValue">0.0005</span></p>

</div>

<div class="section">

<h2>Daily Check-in</h2>

<button onclick="dailyReward()">Claim 1000 Coins</button>

</div>

<div class="section">

<h2>Buy Tutam Coins</h2>

<input id="buyAmount" placeholder="Enter coins">
<button onclick="buyCoins()">Buy</button>

</div>

<div class="section">

<h2>Withdraw Coins</h2>

<p>Minimum withdrawal: 10,000 coins</p>

<input id="withdrawAmount" placeholder="Coins to withdraw">
<input id="withdrawAccount" placeholder="Account (PayPal / Wallet)">
<button onclick="withdraw()">Withdraw</button>

</div>

<div class="section">

<h2>Earn Coins</h2>

<div class="task">

<h3>Watch Video (+200)</h3>

<iframe width="100%" height="200"
src="https://www.youtube.com/embed/dQw4w9WgXcQ">
</iframe>

<button onclick="earn(200)">Complete Task</button>

</div>

</div>

<div class="section">

<h2>Tutam Market Graph</h2>

<canvas id="marketChart"></canvas>

</div>

</div>

<!-- SIGNUP -->

<div class="modal" id="signupModal">

<div class="modal-content">

<span class="close" onclick="closeModal('signupModal')">×</span>

<h2>Sign Up</h2>

<input id="suUser" placeholder="Username"><br>
<input id="suPass" type="password" placeholder="Password"><br>

<button onclick="signup()">Register</button>

</div>

</div>

<!-- LOGIN -->

<div class="modal" id="loginModal">

<div class="modal-content">

<span class="close" onclick="closeModal('loginModal')">×</span>

<h2>Sign In</h2>

<input id="liUser" placeholder="Username"><br>
<input id="liPass" type="password" placeholder="Password"><br>

<button onclick="login()">Login</button>

</div>

</div>

<script>

/* USER */

let username=localStorage.getItem("tutamUser");

let coins=parseInt(localStorage.getItem("tutamCoins")||0);

updateBalance();

function updateBalance(){
document.getElementById("balance").innerText=coins;
}

/* SAVE */

function save(){
localStorage.setItem("tutamCoins",coins);
updateBalance();
}

/* EARN */

function earn(amount){
coins+=amount;
save();
}

/* BUY */

function buyCoins(){

let amount=parseInt(document.getElementById("buyAmount").value);

if(amount>0){
coins+=amount;
save();
}

}

/* DAILY */

function dailyReward(){

let last=localStorage.getItem("daily");

let today=new Date().toDateString();

if(last===today){
alert("Daily reward already claimed");
return;
}

coins+=1000;

localStorage.setItem("daily",today);

save();

}

/* WITHDRAW */

function withdraw(){

let amount=parseInt(document.getElementById("withdrawAmount").value);

let account=document.getElementById("withdrawAccount").value;

if(amount<10000){
alert("Minimum withdrawal is 10,000 coins");
return;
}

if(amount>coins){
alert("Not enough balance");
return;
}

coins-=amount;

save();

alert(username+" withdrawal successful. Withdraw amount "+amount+" coins to "+account);

}

/* SIGNUP */

function signup(){

let u=document.getElementById("suUser").value;

let p=document.getElementById("suPass").value;

localStorage.setItem("tutamUser",u);
localStorage.setItem("tutamPass",p);

username=u;

alert("Account created");

closeModal("signupModal");

}

/* LOGIN */

function login(){

let u=document.getElementById("liUser").value;
let p=document.getElementById("liPass").value;

let su=localStorage.getItem("tutamUser");
let sp=localStorage.getItem("tutamPass");

if(u===su && p===sp){

username=u;

alert("Login successful");

closeModal("loginModal");

}else{

alert("Invalid login");

}

}

/* MODAL */

function openModal(id){
document.getElementById(id).style.display="block";
}

function closeModal(id){
document.getElementById(id).style.display="none";
}

/* COIN PRICE */

let price=0.0005;

setInterval(()=>{

price+=0.00001;

document.getElementById("coinValue").innerText=price.toFixed(6);

},5000);

/* MARKET GRAPH */

const ctx=document.getElementById("marketChart");

let prices=[10,12,11,14,13,15,17];

new Chart(ctx,{

type:"line",

data:{
labels:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],
datasets:[{
label:"Tutam Coin Market",
data:prices,
borderColor:"green",
borderWidth:2,
fill:false
}]
}

});

</script>

</body>
</html>
